<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume AI · 로그인</title>
    <link rel="stylesheet" href="/static/style.css?v=20260610-20">
</head>

<body>
    <header class="app-header">
        <h1>Resume AI</h1>
        <p class="subtitle">FastAPI 기반 이력서 분석/매칭 관리 시스템</p>
    </header>

    <main class="login-wrap">
        <section class="card login-card">
            <h2>로그인</h2>

            <div class="form-group">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" autocomplete="username" placeholder="admin" autofocus>
            </div>

            <div class="form-group">
                <label for="loginPassword">비밀번호</label>
                <input type="password" id="loginPassword" autocomplete="current-password" placeholder="비밀번호">
            </div>

            <div class="btn-row">
                <button id="loginBtn" type="button">로그인</button>
            </div>

            <p id="loginError" class="text-danger login-error hidden"></p>
        </section>
    </main>

    <script src="/static/login.js?v=20260610-20"></script>
</body>

</html>
