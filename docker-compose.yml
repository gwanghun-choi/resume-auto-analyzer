# Docker Compose 실행용. (NCP 서버에 파일 복사 후 `docker compose up -d --build`)
#
# 포트: 호스트 18080 -> 컨테이너 8000  → 접속 http://서버IP:18080 (/docs)
#
# 주의(.env 경로): Docker Compose 실행 시 Google OAuth 파일 경로는 컨테이너 내부 절대경로를 사용해야 합니다.
#   GOOGLE_CREDENTIALS_PATH=/app/secrets/google/credentials.json
#   GOOGLE_TOKEN_PATH=/app/secrets/google/token.json
#   (로컬 WSL 직접 실행 시에는 secrets/google/... 상대경로 사용 가능)
#   .env / secrets / credentials.json / token.json 은 이미지에 포함하지 않고 runtime 으로만 주입합니다.
services:
  # Redis: Celery broker(0) / result backend(1). 컨테이너 내부에서 'redis' 서비스명으로 접근합니다.
  redis:
    image: redis:7-alpine
    container_name: resume-ai-redis
    restart: unless-stopped
    # 기본은 내부 네트워크로만 접근(app/worker 가 redis:6379 로 접근). 로컬 디버깅 시에만 아래 주석 해제.
    #ports:
    #  - "6379:6379"

  resume-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "28080:8000"
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    volumes:
      # Google OAuth secrets (이미지에 넣지 않고 volume 으로만 연결)
      - ./secrets/google:/app/secrets/google
      # 업로드/캐시/임시 파일 유지
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Celery worker: 사람인 공고 JD 분석(job_discovery) + 이력서 분석(resume_analysis) 큐를 함께 처리.
  # (선택 A — 한 worker 가 두 큐 처리. 부하 커지면 resume_analysis 전용 worker 로 분리 검토 — docs/TODO)
  # (worker 도 DB / OPENAI_API_KEY / Google credentials / 회사 CA 에 접근해야 하므로 app 과 동일하게 구성)
  resume-ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-ai-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=INFO", "-Q", "job_discovery,resume_analysis"]
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./secrets/google:/app/secrets/google
      - ./data:/app/data
