[project]
name = "resume-auto-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ghchoi", email = "ghchoi@didim.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "celery>=5.6.3",
    "fastapi>=0.136.3",
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "google-generativeai>=0.8.6",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.6",
    "langchain-google-genai>=4.2.4",
    "langgraph>=1.2.4",
    "openai>=2.41.0",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
